<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meus Favoritos - Kakuab Market">
  <title>Meus Favoritos | Kakuab Market</title>
  
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/home.css">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="assets/images/logo.png" alt="Kakuab Market Logo">
        <strong>kakuab</strong> <span>market</span>
      </a>

      <div class="nav-links" id="navLinks">
        <a href="index.html">Início</a>
        <a href="index.html#products">Produtos</a>
      </div>

      <div class="nav-actions">
        <div class="user-dropdown-container" id="navUserMenu">
          <button aria-label="Menu do Usuário" class="user-menu-btn" onclick="toggleUserDropdown()">
            <span class="material-icons-outlined">account_circle</span>
            <span id="navUserName" style="font-size:0.9rem;font-weight:600;margin-left:4px;">Usuário</span>
            <span class="material-icons-outlined" style="font-size:1rem;">expand_more</span>
          </button>
          
          <div class="user-dropdown-menu" id="userDropdownMenu" style="display: none;">
            <a href="meu-perfil.html"><span class="material-icons-outlined">person</span> Meu Perfil</a>
            <a href="favoritos.html"><span class="material-icons-outlined">favorite</span> Favoritos</a>
            <div class="dropdown-divider"></div>
            <a href="#" onclick="fazerLogout()" class="logout-link"><span class="material-icons-outlined">logout</span> Sair</a>
          </div>
        </div>
      </div>
    </div>
  </nav>

  <main style="background: var(--gray-50); min-height: calc(100vh - 64px - 100px); padding: 40px 0;">
    <div class="container">
      <div style="margin-bottom: 32px;">
        <h1 style="font-size: 2rem; color: var(--text-primary);">Meus Favoritos</h1>
        <p style="color: var(--text-secondary);">Anúncios que você salvou para ver mais tarde.</p>
      </div>

      <!-- Grid de Favoritos (Reutiliza a classe products-grid da home) -->
      <div class="products-grid" id="favoritosGrid">
        <div style="grid-column: 1 / -1; text-align: center; padding: 60px 20px;">
          <span class="material-icons-outlined" style="font-size: 3rem; color: var(--text-muted); animation: pulse 1.5s infinite;">hourglass_empty</span>
          <p style="margin-top: 16px; color: var(--text-muted);">Carregando favoritos...</p>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <div class="footer-bottom" style="margin-top: 0; padding-top: 20px;">
        <p>© 2026 Kakuab Market. Todos os direitos reservados.</p>
      </div>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/favoritos.js"></script>
</body>
</html>
